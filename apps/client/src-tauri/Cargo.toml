[package]
name = "remote-sessions-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Remote Sessions desktop and mobile shell"

[lib]
name = "remote_sessions_client"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
remote-sessions-core = { path = "../../../crates/client-core" }

[target.'cfg(target_os = "macos")'.dependencies]
remote-sessions-desktop-bridge = { path = "../../../crates/desktop-bridge" }
tauri-plugin-dialog = { version = "=2.8.4", default-features = false }
