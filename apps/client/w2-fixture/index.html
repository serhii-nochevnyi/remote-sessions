<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline terminal fixture</title>
    <style>
      :root { color-scheme: dark; font: 16px system-ui, sans-serif; background: #111a21; color: #d9e6e2; }
      body {
        margin: 0;
        padding: max(1rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right))
          max(1rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
      }
      h1 { font-size: 1.25rem; margin-block: 0 0.5rem; }
      button { min-height: 44px; margin-inline-end: 0.5rem; font: inherit; }
      #terminal { margin-block: 1rem; overflow: hidden; min-height: 8rem; }
      output { font-family: ui-monospace, monospace; overflow-wrap: anywhere; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
