# Dedicated product server only; never load or modify the user's tmux config.
set-option -g exit-empty off
set-option -g exit-unattached off
set-option -g destroy-unattached off
set-option -g default-shell /bin/sh
set-option -g update-environment ''
set-option -g allow-rename off
set-option -g automatic-rename off
set-option -g set-clipboard off
set-option -g history-limit 2000
set-option -g status off
set-option -g remain-on-exit on
# Viewers must not dictate the runtime's dimensions.
set-option -g window-size manual
set-option -g base-index 0
set-option -g pane-base-index 0
